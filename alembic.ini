# Alembic configuration.
#
# sqlalchemy.url is intentionally NOT set here: alembic/env.py reads DATABASE_URL from
# src.core.config (environment variables / .env), so credentials never live in this file
# or in version control. Logging is configured by src.core.logger (with secret redaction),
# therefore this file has no [loggers]/[handlers] sections.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# 20261024_0001_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
