worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # $uri instead of $request: query strings (which may carry ?token=) are never logged.
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64k;

    # Docker DNS; re-resolve so `--scale app=N` replicas are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream app_backend {
        zone app_backend 64k;
        server app:8000 resolve;
    }

    server {
        listen 80;

        location /ws {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;  # overwrite: clients cannot spoof their IP
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clients ping every 20s; idle sockets are closed after 2 minutes.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;  # overwrite: clients cannot spoof their IP
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
